[project]
name = "forecast"
version = "0.1.0"
description = "Team Fight Club - Dynamic Retail Sales Forecasting (Walmart, XGBoost)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "xgboost",
    "scikit-learn",
    "optuna",
    "shap",
    "matplotlib",
    "seaborn",
    "plotly",
    "jupyter",
    "nbconvert",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
